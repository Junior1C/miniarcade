<body>
  <a class="skip-link" href="#games">К каталогу игр</a>

  <header class="site-header">
    <p class="site-header__brand"><span aria-hidden="true">🎮</span> MiniArcade</p>
    <h1 class="site-header__title">Каталог браузерных HTML5-игр</h1>
    <nav class="site-nav" aria-label="Разделы сайта">
      <a class="site-nav__link" href="stats.html">📊 Статистика</a>
    </nav>
    <div class="search" role="search">
      <label class="visually-hidden" for="search">Поиск игры</label>
      <input id="search" class="search__input" type="search" placeholder="Поиск игры или тега…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </header>

  <main class="site-main" id="main">
    <h2 class="visually-hidden">Игры</h2>
    <p id="results-status" class="results-status" role="status" aria-live="polite"></p>

    <ul id="games" class="game-grid" tabindex="-1" aria-label="Список игр"></ul>

    <p id="empty-state" class="empty-state" hidden>Ничего не найдено — попробуйте другой запрос.</p>

    <div id="load-more-wrap" class="load-more" hidden>
      <button id="load-more" class="button button--secondary" type="button">Показать ещё</button>
    </div>

    <div id="error-state" class="error-state" hidden>
      <p>Не удалось загрузить каталог игр.</p>
      <button id="retry" class="button" type="button">Повторить</button>
    </div>

    <noscript><p class="empty-state">Для работы каталога нужен JavaScript.</p></noscript>
  </main>

  <dialog id="player" class="player" aria-labelledby="player-name">
    <div class="player__bar">
      <p class="player__title">
        <span id="player-emoji" aria-hidden="true"></span>
        <span id="player-name"></span>
        <a id="player-source" class="player__source" href="#" hidden>исходник ↗</a>
      </p>
      <button id="player-close" class="button button--danger" type="button" commandfor="player" command="close">✕ Закрыть</button>
    </div>
    <div id="player-loading" class="player__loading" hidden>
      <span class="player__loading-track" aria-hidden="true"><span class="player__loading-fill"></span></span>
      <span role="status">Загрузка игры…</span>
    </div>
    <iframe
      id="player-frame"
      class="player__frame"
      title="Игра"
      src="about:blank"
      sandbox="allow-scripts"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </dialog>
</body>
</html>
