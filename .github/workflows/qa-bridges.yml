name: QA Bridges

# Еженедельный обход внешних мостов: отвечают ли, разрешают ли встраивание.
# REPORT-ONLY: аптайм третьих сторон — не наша ответственность
# (см. README § "Мосты"), воркфлоу не валит CI, но строгий отчёт
# прикладывается артефактом — раз в неделю глазами чистим мёртвые мосты
# (WARN >200, FAIL >300 в budgets: каждый мост растит frame-src и index.html).
# Ручной строгий прогон: npm run qa:bridges:strict
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

jobs:
  bridges:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/qa-bridges.mjs
      - name: Strict report (artifact, never fails CI)
        run: node scripts/qa-bridges.mjs --strict > bridges-strict.txt 2>&1 || true
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: bridges-strict-report
          path: bridges-strict.txt
