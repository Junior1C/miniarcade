name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build catalog
        run: node scripts/build.mjs
      - name: Generated files are fresh
        # Каталог/sitemap/SEO/заголовки генерируются и коммитятся:
        # забытый `npm run build` должен валить CI, а не ехать stale.
        run: git diff --exit-code -- data/catalog.json sitemap.xml index.html stats.html _headers vercel.json
      - name: Test
        run: node --test
      - name: Performance budgets
        run: node scripts/check-budgets.mjs
      - name: Deploy
        # Деплой идёт через Cloudflare Pages git-интеграцию (тот же коммит,
        # что GitHub Pages и Vercel). wrangler.jsonc оставлен только для
        # D1-тулинга (stats.yml). 'wrangler deploy' (Workers Assets) здесь
        # НЕ запускаем: он опубликовал бы functions/ как статику и оторвал
        # бы Pages Function + STATS_DB-биндинг приёмника аналитики.
        run: |
          echo "Deploy path is the Cloudflare Pages git integration."
          echo "wrangler.jsonc is kept for D1 tooling (stats.yml) only."
