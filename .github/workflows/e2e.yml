name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Generated files are fresh
        run: git diff --exit-code -- data/catalog.json sitemap.xml index.html stats.html _headers vercel.json
      - run: node --test
      - run: npm run budgets
      - run: npm run qa
      - run: npm run test:e2e

  # Точечный блокер для новых мостов: полный обход (qa-bridges) — report-only
  # по дизайну, но изменённые meta.json проверяются живьём и валят CI.
  changed-bridges:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/verify-changed.mjs --base=origin/main
