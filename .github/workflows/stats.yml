name: Stats

# Ночной забор аналитики в репозиторий: D1 -> data/stats/*.json -> коммит.
# Сырьё старше 120 дней подрезается (в git живут только агрегаты).
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pull aggregates from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured — skipping stats pull."
            echo "One-time setup is documented in README § Analytics."
            exit 0
          fi
          npx -y wrangler@4.136.3 d1 execute miniarcade_stats --remote --file stats/schema.sql
          # Миграция существующих баз: SQLite не умеет ADD COLUMN IF NOT EXISTS,
          # поэтому повторный прогон падает с "duplicate column" — глушим именно
          # его (таблица уже создана шагом выше, других причин падения нет).
          npx -y wrangler@4.136.3 d1 execute miniarcade_stats --remote --command "ALTER TABLE events ADD COLUMN visitor TEXT" || echo "visitor column already exists, continuing."
          npx -y wrangler@4.136.3 d1 execute miniarcade_stats --remote --json --command "SELECT day, host, game, event, COUNT(*) AS n, COALESCE(SUM(secs), 0) AS secs, COUNT(DISTINCT visitor) AS uniques FROM events WHERE day >= date('now', '-90 days') GROUP BY day, host, game, event ORDER BY day DESC LIMIT 20000" > /tmp/stats.json
          npx -y wrangler@4.136.3 d1 execute miniarcade_stats --remote --command "DELETE FROM events WHERE day < date('now', '-120 days')"
          node scripts/pull-stats.mjs /tmp/stats.json data/stats
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats
          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "stats: daily aggregates"
          git push origin main
