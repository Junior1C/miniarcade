name: Deploy Worker (manual)

# Ручная активация Worker-зеркала (см. README § «Деплой»).
# Только workflow_dispatch — автозапуска нет осознанно: деплой переключаемого
# производственного трафика делается глазами, после проверки на workers.dev.
# Деплой НЕ трогает pages.dev: воркер поднимается на
# miniarcade.<subdomain>.workers.dev, роут переключается в dashboard.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build catalog
        run: node scripts/build.mjs
      - name: Test
        run: node --test
      - name: Performance budgets
        run: node scripts/check-budgets.mjs
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured — cannot deploy."
            exit 1
          fi
          npx -y wrangler@4.136.3 deploy
