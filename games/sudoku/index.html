<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Судоку — MiniArcade</title>
  <link rel="stylesheet" href="../../assets/css/game-shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🔢</span> Судоку</h1>
    <p class="hud__score"><output id="difficulty">Лёгкая</output> • Ошибки: <output id="mistakes">0</output></p>
  </header>

  <main>
    <div id="grid" class="grid" role="grid" aria-label="Поле судоку 9 на 9"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="pad" class="pad" role="group" aria-label="Цифры"></div>
    <div class="controls">
      <button id="erase" class="button" type="button">Стереть</button>
      <button id="restart" class="button" type="button">Новая партия</button>
    </div>
    <p class="hint">Выберите клетку, затем цифру или клавишу 1–9. Одинаковые цифры подсвечиваются</p>
  </main>
</body>
</html>
