<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Пятнашки — MiniArcade</title>
  <link rel="stylesheet" href="../../assets/css/game-shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🧩</span> Пятнашки</h1>
    <p class="hud__score">Ходов: <output id="moves">0</output> • Рекорд сессии: <output id="best">—</output></p>
  </header>

  <main>
    <div id="grid" class="grid" role="group" aria-label="Поле пятнашек 4 на 4"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="restart" class="button" type="button">Перемешать</button>
    <p class="hint">Соберите числа от 1 до 15 по порядку. Ходит и клавиатура: стрелки двигают дырку</p>
  </main>
</body>
</html>
