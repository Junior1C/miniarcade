<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>2048 — MiniArcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🔢</span> 2048</h1>
    <p class="hud__score">Счёт: <output id="score">0</output> • Рекорд сессии: <output id="best">0</output></p>
  </header>

  <main>
    <div id="grid" class="grid" role="img" aria-label="Поле 2048"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="restart" class="button" type="button">Новая партия</button>
    <p class="hint">Управление: стрелки/WASD или свайпы. Соберите плитку 2048</p>
  </main>
</body>
</html>
