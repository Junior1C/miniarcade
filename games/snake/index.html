<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Змейка — MiniArcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🐍</span> Змейка</h1>
    <p class="hud__score">Счёт: <output id="score">0</output></p>
  </header>

  <main>
    <canvas id="board" width="300" height="300" role="img" aria-label="Игровое поле змейки"></canvas>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="pad" role="group" aria-label="Кнопки управления змейкой">
      <button class="pad__btn pad__btn--up" type="button" data-code="ArrowUp" aria-label="Вверх">▲</button>
      <button class="pad__btn pad__btn--left" type="button" data-code="ArrowLeft" aria-label="Влево">◀</button>
      <button class="pad__btn pad__btn--down" type="button" data-code="ArrowDown" aria-label="Вниз">▼</button>
      <button class="pad__btn pad__btn--right" type="button" data-code="ArrowRight" aria-label="Вправо">▶</button>
    </div>
    <p class="hint">Управление: WASD, стрелки, свайпы или кнопки</p>
  </main>
</body>
</html>
