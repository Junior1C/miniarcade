<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Ударь крота — MiniArcade</title>
  <link rel="stylesheet" href="../../assets/css/game-shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🐹</span> Ударь крота</h1>
    <p class="hud__score">Счёт: <output id="score">0</output> • Время: <output id="time">30</output> • Рекорд сессии: <output id="best">0</output></p>
  </header>

  <main>
    <div id="field" class="field" role="group" aria-label="Девять норок"></div>
    <p id="status" class="status" role="status" aria-live="polite">Успейте стукнуть как можно больше кротов за 30 секунд!</p>
    <button id="start" class="button" type="button">Старт</button>
    <p class="hint">Крот выглядывает меньше секунды — бейте мышью, пальцем или Tab+Enter</p>
  </main>
</body>
</html>
