<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Саймон — MiniArcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🎹</span> Саймон</h1>
    <p class="hud__score">Уровень: <output id="level">0</output> • Рекорд сессии: <output id="best">0</output></p>
  </header>

  <main>
    <div id="pads" class="pads" role="group" aria-label="Четыре звуковые кнопки">
      <button class="pad pad--green" type="button" data-pad="0" aria-label="Зелёная, клавиша 1">1</button>
      <button class="pad pad--red" type="button" data-pad="1" aria-label="Красная, клавиша 2">2</button>
      <button class="pad pad--yellow" type="button" data-pad="2" aria-label="Жёлтая, клавиша 3">3</button>
      <button class="pad pad--blue" type="button" data-pad="3" aria-label="Синяя, клавиша 4">4</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">Нажмите «Старт» и повторяйте мелодию.</p>
    <button id="start" class="button" type="button">Старт</button>
    <p class="hint">Ошибка — мелодия повторяется. Клавиши 1–4 тоже работают</p>
  </main>
</body>
</html>
