<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Дино-раннер — MiniArcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🦖</span> Дино-раннер</h1>
    <p class="hud__score">Счёт: <output id="score">0</output> • Рекорд сессии: <output id="best">0</output></p>
  </header>

  <main>
    <canvas id="board" width="320" height="200" role="img" aria-label="Бегущий динозавр и кактусы"></canvas>
    <p id="status" class="status" role="status" aria-live="polite">Пробел, ↑ или тап — прыжок, ↓ — пригнуться.</p>
    <p class="hint">Кактусы ближе к земле, птеры летят выше — пригибайтесь</p>
  </main>
</body>
</html>
