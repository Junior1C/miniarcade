<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Сапёр — MiniArcade</title>
  <link rel="stylesheet" href="../../assets/css/game-shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">💣</span> Сапёр</h1>
    <p class="hud__score">Мины: <output id="mines">10</output> • Флаги: <output id="flags">0</output></p>
  </header>

  <main>
    <div id="grid" class="grid" role="group" aria-label="Минное поле 9 на 9"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="controls">
      <button id="mode" class="button" type="button" aria-pressed="false">⛏ Копать</button>
      <button id="restart" class="button" type="button">Новая партия</button>
    </div>
    <p class="hint">Клик — открыть, правая кнопка или режим 🚩 — флаг. Первый клик всегда безопасен</p>
  </main>
</body>
</html>
