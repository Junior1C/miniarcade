<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Пакман — MiniArcade</title>
  <link rel="stylesheet" href="../../assets/css/game-shared.css">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🟡</span> Пакман</h1>
    <p class="hud__score">Счёт: <output id="score">0</output> • Жизни: <output id="lives">3</output> • Рекорд сессии: <output id="best">0</output></p>
  </header>

  <main>
    <canvas id="board" width="304" height="240" role="img" aria-label="Лабиринт пакмана"></canvas>
    <p id="status" class="status" role="status" aria-live="polite">Стрелка или свайп — начать. Съешьте все точки!</p>
    <div class="pad" role="group" aria-label="Кнопки управления пакманом">
      <button class="pad__btn pad__btn--up" type="button" data-dir="up" aria-label="Вверх">▲</button>
      <button class="pad__btn pad__btn--left" type="button" data-dir="left" aria-label="Влево">◀</button>
      <button class="pad__btn pad__btn--down" type="button" data-dir="down" aria-label="Вниз">▼</button>
      <button class="pad__btn pad__btn--right" type="button" data-dir="right" aria-label="Вправо">▶</button>
    </div>
    <p class="hint">Большие точки дают силу есть привидений. Управление: стрелки/WASD или свайпы</p>
  </main>
</body>
</html>
