<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Мемори — MiniArcade</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header class="hud">
    <h1><span aria-hidden="true">🃏</span> Мемори</h1>
  </header>

  <main>
    <p id="status" class="status" role="status" aria-live="polite">Найдено пар: 0 из 8</p>
    <div id="grid" class="grid"></div>
    <button id="restart" class="button" type="button">Новая партия</button>
  </main>
</body>
</html>
